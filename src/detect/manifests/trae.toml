id = "trae"
version = "2026.07.09.1"
min_engine_version = 2
updated_at = "2026-07-09T00:00:00Z"

[[rules]]
id = "permission_prompt_blocked"
state = "blocked"
priority = 1000
region = "after_last_horizontal_rule"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit | esc to cancel"] },
]

[[rules]]
id = "turn_in_progress_working"
state = "working"
priority = 500
region = "whole_recent"
visible_working = true
contains = ["esc to interrupt"]

[[rules]]
id = "no_activity_idle"
state = "idle"
priority = 100
region = "whole_recent"
visible_idle = true
regex = ['\S']
not = [
  { contains = ["esc to interrupt"] },
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit | esc to cancel"] },
]
